name: Boost CI (Artifact)

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select Boost release tag'
        required: true
        default: '4.0.0-boost-6.3.0'
        type: choice
        options:
          - 4.0.0-boost-6.3.0
          - 4.0.0-boost-6.3.0.E
          - 4.0.0-boost-6.2.0
          - v3.4.2.6-boost-v6
          - released-master-2026-06-30
      buildVariant:
        description: 'Select flavor to build'
        required: true
        default: 'aapsclientDebug'
        type: choice
        options:
          - fullDebug
          - aapsclientDebug
          - aapsclient2Debug
          - aapsclient3Debug
          - pumpcontrolDebug

env:
  BOOST_REPO: tim2000s/Boost
  BUILD_VARIANT: ${{ github.event.inputs.buildVariant }}

permissions:
  contents: read

jobs:
  build:
    name: Build Boost APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected Boost release
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BOOST_REPO }}
          ref: refs/tags/${{ github.event.inputs.tagName }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set VERSION
        env:
          TAG: ${{ github.event.inputs.tagName }}
        run: echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Add swap on small runners
        run: |
          if [ "$(free -m | awk '/^Mem:/{print $2}')" -lt 12000 ]; then
            DIR=$(df --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -rn | head -1 | awk '{print $2}')
            sudo fallocate -l 6G "$DIR/boost-swap" && sudo chmod 600 "$DIR/boost-swap" && sudo mkswap "$DIR/boost-swap" && sudo swapon "$DIR/boost-swap"
          fi

      - name: Build APKs
        run: |
          ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss4m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.caching=true

      - name: Rename APKs with version
        run: |
          FLAVOR="${BUILD_VARIANT%Debug}"
          echo "Flavor: $FLAVOR / Variant: $BUILD_VARIANT"
          mv app/build/outputs/apk/${FLAVOR}/debug/*.apk boost-${FLAVOR}-${VERSION}.apk
          mv wear/build/outputs/apk/${FLAVOR}/debug/*.apk boost-wear-${FLAVOR}-${VERSION}.apk
          ls -lh boost-*.apk

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boost-${{ github.event.inputs.buildVariant }}-${{ github.event.inputs.tagName }}
          path: boost-*.apk
          retention-days: 30
