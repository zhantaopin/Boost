name: Boost CI (Artifact)

on:
  workflow_dispatch:
    inputs:
      tagName:
        description: 'Select Boost release tag'
        required: true
        default: '4.0.0-boost-6.3.0'
        type: choice
        options:
          - 4.0.0-boost-6.3.0
          - 4.0.0-boost-6.3.0.E
          - 4.0.0-boost-6.2.0
          - v3.4.2.6-boost-v6
          - released-master-2026-06-30
      buildVariant:
        description: 'Select flavor to build'
        required: true
        default: 'aapsclientDebug'
        type: choice
        options:
          - fullDebug
          - aapsclientDebug
          - aapsclient2Debug
          - aapsclient3Debug
          - pumpcontrolDebug
      isolateWearPermission:
        description: 'Scope app.aaps.weardata.permission to this applicationId (lets the APK install next to a differently signed AAPS)'
        required: true
        default: false
        type: boolean

env:
  BOOST_REPO: tim2000s/Boost
  BUILD_VARIANT: ${{ github.event.inputs.buildVariant }}

permissions:
  contents: read

jobs:
  build:
    name: Build Boost APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected Boost release
        uses: actions/checkout@v5
        with:
          repository: ${{ env.BOOST_REPO }}
          ref: refs/tags/${{ github.event.inputs.tagName }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set VERSION
        env:
          TAG: ${{ github.event.inputs.tagName }}
        run: echo "VERSION=$TAG" >> "$GITHUB_ENV"

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # AAPS hardcodes app.aaps.weardata.permission so that every flavor shares one signature
      # level permission, which only works when every APK carries the same certificate. With a
      # differently signed AAPS already on the phone, Android answers -112 and refuses the
      # install. Scoping the name to this applicationId gives the APK a permission of its own;
      # the master can then no longer receive wear data from it, everything else is unaffected.
      - name: Scope wear permission to this applicationId
        if: ${{ github.event.inputs.isolateWearPermission == 'true' }}
        run: |
          MANIFEST=plugins/sync/src/androidMain/AndroidManifest.xml
          WEARPLUGIN=plugins/sync/src/androidMain/kotlin/app/aaps/plugins/sync/wear/WearPlugin.kt
          sed -i 's|"app\.aaps\.weardata\.permission"|"${applicationId}.weardata.permission"|g' "$MANIFEST"
          sed -i 's|WearDataReceiver\.PERMISSION|context.packageName + ".weardata.permission"|g' "$WEARPLUGIN"
          grep -n "weardata.permission" "$MANIFEST" "$WEARPLUGIN"

      - name: Add swap on small runners
        run: |
          if [ "$(free -m | awk '/^Mem:/{print $2}')" -lt 12000 ]; then
            DIR=$(df --output=avail,target / /mnt 2>/dev/null | tail -n +2 | sort -rn | head -1 | awk '{print $2}')
            sudo fallocate -l 6G "$DIR/boost-swap" && sudo chmod 600 "$DIR/boost-swap" && sudo mkswap "$DIR/boost-swap" && sudo swapon "$DIR/boost-swap"
          fi

      - name: Build APKs
        run: |
          ./gradlew :app:assemble${{ env.BUILD_VARIANT }} :wear:assemble${{ env.BUILD_VARIANT }} \
            -Dorg.gradle.jvmargs="-Xmx8g -XX:+UseParallelGC -Xss4m" \
            -Dkotlin.daemon.jvm.options="-Xmx2g" \
            -Dkotlin.compiler.execution.strategy="in-process" \
            -Dorg.gradle.daemon=true \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.caching=true

      - name: Rename APKs with version
        run: |
          FLAVOR="${BUILD_VARIANT%Debug}"
          echo "Flavor: $FLAVOR / Variant: $BUILD_VARIANT"
          mv app/build/outputs/apk/${FLAVOR}/debug/*.apk boost-${FLAVOR}-${VERSION}.apk
          mv wear/build/outputs/apk/${FLAVOR}/debug/*.apk boost-wear-${FLAVOR}-${VERSION}.apk
          ls -lh boost-*.apk

      # AAPS declares app.aaps.weardata.permission as protectionLevel="signature" and every flavor
      # (full, aapsclient1/2/3, pumpcontrol) declares the same name. Android rejects the second
      # install with -112 INSTALL_FAILED_DUPLICATE_PERMISSION unless both APKs carry the same
      # certificate, so the debug key of the runner cannot be used for a build that has to live
      # next to an already installed AAPS. Re-signing here makes the artifact match.
      - name: Sign APKs with the AAPS private key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "🛑 Missing secret KEYSTORE_BASE64. Stopping build."
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/aaps.jks"

          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"

          for f in boost-*.apk; do
            echo "🔐 Signing $f"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/aaps.jks" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --out "signed-$f" "$f"
            mv "signed-$f" "$f"
            "$BT/apksigner" verify --print-certs "$f" | grep -E "certificate DN|SHA-256 digest"
          done

          rm -f "$RUNNER_TEMP/aaps.jks"
          ls -lh boost-*.apk

      - name: Upload APKs as GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: boost-${{ github.event.inputs.buildVariant }}-${{ github.event.inputs.tagName }}
          path: boost-*.apk
          retention-days: 30
